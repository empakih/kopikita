name: Deploy to HestiaCP Server

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Build vendor/ memakai PHP 8.4 di CI (server PHP 8.3 tidak bisa install
      # karena dependency butuh >= 8.4). vendor/ ini akan IKUT di-upload.
      - name: Install PHP Dependencies
        run: composer install --optimize-autoloader --no-dev --prefer-dist --no-progress

      - name: Install JS Dependencies and Build
        run: |
          npm install
          npm run build
          # Hapus yang tidak perlu (TAPI biarkan vendor/ agar ikut terupload)
          rm -rf node_modules
          rm -rf .git

      # nginx server: root = public_html/public, jadi public_html harus folder
      # project (punya subfolder public/), bukan symlink. Pulihkan jika perlu.
      - name: Prepare Directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd web/kelas-b-5.informatika-unjedir.web.id
            if [ -L public_html ]; then
              rm -f public_html
              if [ -d app ]; then mv app public_html; else mkdir -p public_html; fi
            fi
            mkdir -p public_html

      - name: Upload Files to Server via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "."
          target: "web/kelas-b-5.informatika-unjedir.web.id/public_html"

      - name: Execute Setup Commands via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd web/kelas-b-5.informatika-unjedir.web.id/public_html

            # Pilih PHP 8.4 bila tersedia (project butuh PHP >= 8.4)
            PHP_BIN=$(command -v php8.4 || command -v php)
            echo ">> Memakai PHP: $PHP_BIN"; $PHP_BIN -v | head -1
            echo ">> PHP yang terinstall di server:"; ls /usr/bin/php* 2>/dev/null || true

            # Pastikan .env ada
            if [ ! -f .env ]; then cp .env.example .env; fi

            # Set APP_URL ke domain produksi
            sed -i 's|^APP_URL=.*|APP_URL=https://kelas-b-5.informatika-unjedir.web.id|' .env

            # Generate APP_KEY jika masih kosong/invalid
            if ! grep -q "^APP_KEY=base64" .env; then
              echo ">> APP_KEY kosong, generate baru"
              $PHP_BIN artisan key:generate --force
            fi

            # vendor/ sudah diupload dari CI -> TIDAK perlu composer install di server.
            $PHP_BIN artisan migrate --force
            $PHP_BIN artisan storage:link
            $PHP_BIN artisan optimize:clear

            chmod -R 775 storage bootstrap/cache database

      - name: Diagnose
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd web/kelas-b-5.informatika-unjedir.web.id
            echo "===== VERSI PHP FPM DOMAIN (dari fastcgi_pass) ====="
            grep -rhE "fastcgi_pass|php[0-9]+\.[0-9]+" conf/web/kelas-b-5.informatika-unjedir.web.id/ 2>/dev/null | sort -u || echo "tidak terbaca"
            cd public_html
            echo "===== vendor/autoload.php ADA? ====="
            [ -f vendor/autoload.php ] && echo "ADA" || echo "TIDAK ADA"
            echo "===== APP_KEY ====="
            grep -q "^APP_KEY=base64" .env && echo "APP_KEY: ADA" || echo "APP_KEY: KOSONG"
            echo "===== 40 BARIS LARAVEL LOG ====="
            tail -n 40 storage/logs/laravel.log 2>/dev/null || echo "log kosong"
