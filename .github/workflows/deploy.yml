name: Deploy to HestiaCP Server

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PHP Dependencies (untuk Filament CSS)
        run: composer install --prefer-dist --no-progress

      - name: Install JS Dependencies and Build
        run: |
          npm install
          npm run build
          # Hapus folder yang tidak perlu diupload agar transfer cepat
          rm -rf node_modules
          rm -rf vendor
          rm -rf .git

      # nginx di server sudah dikonfigurasi: root = public_html/public.
      # Maka public_html HARUS berupa folder project Laravel (punya subfolder public/),
      # BUKAN symlink. Langkah ini membatalkan symlink lama (jika ada) & memulihkan
      # struktur folder nyata, sambil menjaga .env tetap ada.
      - name: Prepare Directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd web/kelas-b-5.informatika-unjedir.web.id
            if [ -L public_html ]; then
              echo ">> Membatalkan symlink public_html, memulihkan folder project"
              rm -f public_html
              if [ -d app ]; then
                mv app public_html   # 'app' berisi project + .env yang sudah diselamatkan
              else
                mkdir -p public_html
              fi
            fi
            mkdir -p public_html

      - name: Upload Files to Server via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "."
          target: "web/kelas-b-5.informatika-unjedir.web.id/public_html"

      - name: Execute Setup Commands via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd web/kelas-b-5.informatika-unjedir.web.id/public_html

            # Install PHP Dependencies (Composer)
            composer install --optimize-autoloader --no-dev

            # Pastikan .env ada
            if [ ! -f .env ]; then
              cp .env.example .env
              php artisan key:generate
            fi

            # Jalankan Migrasi & Link Storage & Clear Cache
            php artisan migrate --force
            php artisan storage:link
            php artisan optimize:clear

            # Set Permission agar tidak Permission Denied
            chmod -R 775 storage bootstrap/cache database

      - name: Diagnose 500
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd web/kelas-b-5.informatika-unjedir.web.id
            echo "===== DOMAIN DIR ====="
            ls -la
            echo "===== readlink public_html ====="
            readlink -f public_html
            cd public_html
            echo "===== ISI public_html (30) ====="
            ls -la | head -30
            echo "===== .env penting ====="
            grep -E "^APP_ENV|^APP_DEBUG|^APP_URL|^DB_CONNECTION|^DB_DATABASE|^SESSION_DRIVER" .env 2>/dev/null
            grep -q "^APP_KEY=base64" .env && echo "APP_KEY: ADA" || echo "APP_KEY: KOSONG/INVALID"
            echo "===== Aktifkan APP_DEBUG sementara ====="
            sed -i 's/^APP_DEBUG=.*/APP_DEBUG=true/' .env
            php artisan optimize:clear
            echo "===== PERM storage & cache ====="
            ls -ld storage storage/logs storage/framework storage/framework/views bootstrap/cache 2>/dev/null
            echo "===== 60 BARIS LARAVEL LOG ====="
            tail -n 60 storage/logs/laravel.log 2>/dev/null || echo "log kosong/tidak ada"
